name: Publish local-auth Outline image

on:
  push:
    branches:
      - feature/local-password-auth
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.21.0

      - name: Install dependencies
        run: |
          corepack enable
          yarn install --immutable

      - name: Build Outline
        run: yarn build
        env:
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Prepare runtime image context
        run: |
          mkdir image-context
          cp -a build server public .sequelizerc package.json image-context/
          cp Dockerfile.local-auth image-context/Dockerfile

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/ludovicoyin/outline
          tags: |
            type=raw,value=local-auth-070f193
            type=sha,format=long

      - uses: docker/build-push-action@v6
        with:
          context: image-context
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Make package publicly pullable
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PATCH user/packages/container/outline/visibility \
            --field visibility=public
